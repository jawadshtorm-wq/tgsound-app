<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TgSound Clone</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-box {
            flex: 1;
            padding: 12px 15px;
            border-radius: 10px;
            border: none;
            background-color: var(--tg-theme-secondary-bg-color, #232e3c);
            color: var(--tg-theme-text-color, #ffffff);
            font-size: 16px;
            outline: none;
        }
        .search-btn {
            background-color: #2481cc;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 15px;
            font-size: 16px;
            cursor: pointer;
        }
        .track {
            background-color: var(--tg-theme-secondary-bg-color, #232e3c);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .track-img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
        }
        .track-info {
            flex: 1;
            overflow: hidden;
        }
        .track-title {
            font-weight: bold;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-artist {
            font-size: 13px;
            color: #8b9bb4;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .action-btn {
            background: transparent;
            color: #2481cc;
            border: 1px solid #2481cc;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }
        .action-btn:active {
            background: #2481cc;
            color: white;
        }
        /* Плеер внизу */
        #player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--tg-theme-secondary-bg-color, #232e3c);
            padding: 10px;
            box-sizing: border-box;
            display: none; /* Скрыт, пока нет трека */
            flex-direction: column;
            border-top: 1px solid #333;
        }
        .player-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
            text-align: center;
        }
        audio {
            width: 100%;
            height: 40px;
        }
    </style>
</head>
<body>
    <div class="search-container">
        <input type="text" class="search-box" id="searchInput" placeholder="Введите название песни...">
        <button class="search-btn" onclick="searchMusic()">🔍</button>
    </div>

    <div id="results"></div>

    <div id="player-bar">
        <div class="player-title" id="playerTitle">Трек</div>
        <audio id="audioPlayer" controls></audio>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 
        
        const audioPlayer = document.getElementById('audioPlayer');
        const playerBar = document.getElementById('player-bar');
        const playerTitle = document.getElementById('playerTitle');

        // Функция поиска через открытый API iTunes
        async function searchMusic() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('results');
            
            if (!query) return;
            
            resultsDiv.innerHTML = '<p style="text-align:center; color:#8b9bb4;">Ищу...</p>';

            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=7`);
                const data = await response.json();
                
                resultsDiv.innerHTML = '';
                
                if (data.results.length === 0) {
                    resultsDiv.innerHTML = '<p style="text-align:center; color:#8b9bb4;">Ничего не найдено</p>';
                    return;
                }

                data.results.forEach(track => {
                    const trackDiv = document.createElement('div');
                    trackDiv.className = 'track';
                    
                    trackDiv.innerHTML = `
                        <img src="${track.artworkUrl60}" class="track-img">
                        <div class="track-info">
                            <div class="track-title">${track.trackName}</div>
                            <div class="track-artist">${track.artistName}</div>
                        </div>
                        <button class="action-btn" onclick="sendToBot('${track.artistName} - ${track.trackName}')">⬇️ Скачать</button>
                    `;
                    
                    // При клике на сам трек - включаем отрывок (30 сек)
                    trackDiv.addEventListener('click', (e) => {
                        if(e.target.tagName === 'BUTTON') return; // Игнорируем клик по кнопке
                        audioPlayer.src = track.previewUrl;
                        playerTitle.innerText = `${track.artistName} - ${track.trackName}`;
                        playerBar.style.display = 'flex';
                        document.body.style.paddingBottom = '100px'; // Отступ под плеер
                        audioPlayer.play();
                    });

                    resultsDiv.appendChild(trackDiv);
                });
            } catch (error) {
                console.error(error);
                resultsDiv.innerHTML = '<p style="text-align:center; color:red;">Ошибка поиска</p>';
            }
        }

        // Отправка запроса в Python-бота
        function sendToBot(query) {
            // Формируем JSON для отправки
            const data = {
                action: "download",
                query: query
            };
            // Отправляем данные боту и закрываем WebApp
            tg.sendData(JSON.stringify(data));
        }
        
        // Поиск по нажатию Enter
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') searchMusic();
        });
    </script>
</body>
</html>
